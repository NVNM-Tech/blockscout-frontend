name: MANTRA release image

# Branch v<upstream-semver>-mantra carries the NVNM-Tech patches on top of upstream tag v<upstream-semver>.
# Release tags on that branch: v<upstream-semver>-mantra.<n>, e.g. v2.12.1-mantra.1.
# A tag named exactly like the branch is not used: `git push origin v2.12.1-mantra` would be ambiguous.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-mantra.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v*-mantra.<n> tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mantra-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # GHCR repository names must be lowercase.
  IMAGE: ghcr.io/nvnm-tech/blockscout-frontend
  UPSTREAM_REPO: https://github.com/blockscout/frontend.git
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  NODE_VERSION: 24.21.0
  PNPM_VERSION: 12.4.1

jobs:
  verify-tag:
    name: Verify tag provenance
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.parse.outputs.upstream_tag }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-mantra\.[0-9]+$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' does not match v<semver>-mantra.<n>"
            exit 1
          fi
          echo "upstream_tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      # 1. the release commit contains the official upstream tag
      # 2. the release commit is on the reviewed branch v<semver>-mantra
      - name: Check ancestry
        env:
          UPSTREAM_TAG: ${{ steps.parse.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags "$UPSTREAM_REPO" "refs/tags/${UPSTREAM_TAG}:refs/tags/upstream/${UPSTREAM_TAG}"
          git merge-base --is-ancestor "refs/tags/upstream/${UPSTREAM_TAG}" HEAD
          git merge-base --is-ancestor HEAD "origin/${UPSTREAM_TAG}-mantra"
          {
            echo "### ${RELEASE_TAG}"
            echo "Upstream base: ${UPSTREAM_TAG}"
            echo '```'
            git log --oneline "refs/tags/upstream/${UPSTREAM_TAG}..HEAD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Lint, typecheck, unit tests
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint:tsc

      - run: pnpm lint:eslint

      - run: pnpm test:vitest

  build:
    name: Build and push image
    needs: [ verify-tag, test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.base.name=blockscout/frontend:${{ needs.verify-tag.outputs.upstream_tag }}

      # GKE nodes running the explorers are amd64 (pods tolerate kubernetes.io/arch=amd64).
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ env.SHORT_SHA }}
            GIT_TAG=${{ env.RELEASE_TAG }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Report-only: base image CVEs must not block a security hotfix release.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${IMAGE}:${RELEASE_TAG}"
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
